name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install project (with mcp extra) and dev tools
        run: |
          uv pip install -e ".[mcp]"
          uv pip install ruff pyright pytest

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pyright
        run: uv run pyright

      - name: pytest (root package)
        run: uv run pytest tests/ -v

      - name: Install tool-browser-bridge module (no deps -- sibling package already installed)
        run: uv pip install -e modules/tool-browser-bridge --no-deps

      - name: pytest (tool-browser-bridge module)
        run: uv run pytest modules/tool-browser-bridge/tests/ -v

  extension:
    name: extension (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check every extension script
        run: |
          set -e
          for f in extension/*.js; do
            echo "Checking $f"
            node --input-type=module --check < "$f"
          done
