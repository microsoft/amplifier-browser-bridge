[project]
name = "amplifier-module-tool-browser-bridge"
version = "0.1.0"
description = "Amplifier tool module: drive the user's real Edge browsers via amplifier-browser-bridge"
requires-python = ">=3.11"
license = { text = "MIT" }
# amplifier-core is a peer dependency -- do NOT declare it here (see
# creating-amplifier-modules skill). amplifier-browser-bridge is the lib this
# module wraps; it lives at the root of this same repository.
#
# PEP 508 direct git reference, not a bare name: `amplifier update` refreshes
# an already-installed bundle module with
# `uv pip install -e <module-dir> --python <app venv> --no-sources`, and
# `--no-sources` disables [tool.uv.sources] entirely. A bare "amplifier-browser-bridge"
# name then resolves only against the PyPI registry, where this unpublished
# package does not exist ("was not found in the package registry"), and the
# refresh fails outright. A direct git URL survives --no-sources because it
# needs no [tool.uv.sources] entry to resolve. See the amplifier-engram
# project's identical fix (same failure, same repo shape: an Amplifier module
# depending on its own repo's root package) for precedent.
dependencies = [
    "amplifier-browser-bridge @ git+https://github.com/microsoft/amplifier-browser-bridge@main",
]

[project.entry-points."amplifier.modules"]
tool-browser-bridge = "amplifier_module_tool_browser_bridge:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_browser_bridge"]

[tool.hatch.metadata]
# Required because `dependencies` above resolves `amplifier-browser-bridge` via
# a direct git reference rather than PyPI -- hatchling refuses to build a wheel
# declaring a direct-reference dependency unless this is set.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"
