bundle:
  name: browser-bridge-behavior
  version: 0.1.0
  description: >-
    Adds the tool-browser-bridge Amplifier tool module (27 browser_* tools
    wrapping amplifier-browser-bridge's HubClient -- 25 drive an already-
    connected browser, and browser_setup/browser_setup_status do first-run/
    re-run onboarding in-process, no CLI on PATH required) plus a thin
    always-on awareness pointer covering the addressing model, the
    three-tier connectivity model, and the queued-result hazard every
    browser_* tool caller must know about.

tools:
  - module: tool-browser-bridge
    # Self-referencing git+subdirectory URL, NOT a relative path. A relative
    # `../modules/...` source is resolved once, at YAML-parse time, against
    # whatever base_path the loading route happens to pass -- which is correct
    # for a direct load_bundle() call but NOT for the git+subdirectory
    # registration this behavior is distributed through (settings.yaml sources).
    # That mismatch makes the tool silently fail to mount while the namespaced
    # context.include below still resolves. The git+subdirectory URL is
    # loader-independent (self-describing, needs no base_path), matching the
    # canonical amplifier-bundle-recipes behavior precedent.
    source: git+https://github.com/microsoft/amplifier-browser-bridge@main#subdirectory=modules/tool-browser-bridge

context:
  include:
    - browser-bridge:context/awareness.md
