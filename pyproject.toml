[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-browser-bridge"
version = "0.1.0"
description = "Cross-device agent <-> real-browser bridge (Microsoft Edge, over Tailscale)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["browser-automation", "microsoft-edge", "tailscale", "mcp", "agent", "amplifier"]
authors = [
    { name = "Microsoft Corporation" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "click>=8.1",
]

[project.optional-dependencies]
# Optional so the core lib/CLI stay lean (design doc \u00a73.3: MCP server is one of
# four agent-surface adapters, not a required dependency of the lib itself).
#
# Upper-bounded at <2: mcp 2.0.0 renamed FastMCP -> MCPServer and relocated it out of
# `mcp.server.fastmcp` entirely (removed, not deprecated -- see the SDK's own v1->v2
# migration guide). src/amplifier_browser_bridge/mcp_server.py imports the v1 path, so
# an unbounded `mcp>=1.6` silently resolves to 2.0.0 today and breaks that import for
# every fresh install -- confirmed via a real ModuleNotFoundError, not just a
# pyright finding. Bump this bound (and migrate mcp_server.py to the v2 API) as a
# deliberate, tested upgrade -- not as a side effect of an unrelated `pip install`.
mcp = ["mcp>=1.6,<2"]

# Everything the documented quality gate needs, declared once so `uv run` syncs it
# automatically. Before this existed, the gate was only runnable after a hand-typed
# `uv pip install` incantation that lived in TWO places -- README.md's testing section
# and .github/workflows/ci.yml -- which is the same two-lists drift that has already
# shipped several broken instructions in this repo. A fresh clone running
# `uv run pytest tests/` used to fail with 46 collection errors; it now just works.
#
# `amplifier-core` is here rather than in modules/tool-browser-bridge/pyproject.toml
# because the module deliberately does not declare it (it is a PEER dependency supplied
# by the host Amplifier install at runtime) -- but the module's tests still need it
# importable, and this is the environment those tests run in.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "amplifier-core",
    "amplifier-browser-bridge[mcp]",
    "amplifier-module-tool-browser-bridge",
]

[tool.uv.sources]
amplifier-browser-bridge = { workspace = true }
amplifier-module-tool-browser-bridge = { path = "modules/tool-browser-bridge", editable = true }

[tool.uv.workspace]
members = ["."]

[project.scripts]
amplifier-browser-bridge = "amplifier_browser_bridge.cli:main"
amplifier-browser-bridge-mcp = "amplifier_browser_bridge.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_browser_bridge"]

# Ship the extension/ source tree inside the wheel so `amplifier-browser-bridge init` can stage it from a
# real (non-editable) install, not just an editable checkout -- see setup.py's
# find_extension_source(). The whole directory is force-included (not a curated file
# list) so the packaged set can never drift from what's actually needed: adding a new
# extension file automatically ships, and the *.test.mjs dev-only files tag along as
# harmless extra bytes rather than a second hardcoded list to keep in sync with
# setup.py's _EXTENSION_FILES. tests/test_packaging.py builds a real wheel and asserts
# every file _EXTENSION_FILES needs is actually present in it.
#
# INSTALL.md ships the same way -- extension_zip.py's find_install_md() bundles it
# into the hub's live GET /setup/extension.zip download (see that module's
# docstring), and without this force-include a real (non-editable) install has no
# INSTALL.md to find at all; only a dev checkout would.
[tool.hatch.build.targets.wheel.force-include]
"extension" = "amplifier_browser_bridge/extension"
"INSTALL.md" = "amplifier_browser_bridge/INSTALL.md"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
