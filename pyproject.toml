[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-browser-bridge"
version = "0.1.0"
description = "Cross-device agent <-> real-browser bridge (Microsoft Edge, over Tailscale)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "click>=8.1",
]

[project.scripts]
abb = "amplifier_browser_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_browser_bridge"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
