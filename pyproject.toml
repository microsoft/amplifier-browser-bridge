[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-browser-bridge"
version = "0.1.0"
description = "Cross-device agent <-> real-browser bridge (Microsoft Edge, over Tailscale)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["browser-automation", "microsoft-edge", "tailscale", "mcp", "agent", "amplifier"]
authors = [
    { name = "Microsoft Corporation" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "click>=8.1",
]

[project.optional-dependencies]
# Optional so the core lib/CLI stay lean (design doc \u00a73.3: MCP server is one of
# four agent-surface adapters, not a required dependency of the lib itself).
mcp = ["mcp>=1.6"]

[project.scripts]
abb = "amplifier_browser_bridge.cli:main"
abb-mcp = "amplifier_browser_bridge.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_browser_bridge"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
